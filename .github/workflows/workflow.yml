# .github/workflows/terraform.yml
name: Terraform

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  id-token: write # OIDC
  contents: read
  pull-requests: write # post plan comments

jobs:
  terraform:
    runs-on: ubuntu-latest

    # PR into main / push to main → prod; otherwise → dev
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}

    concurrency:
      group: terraform-${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false

    env:
      ENV: ${{ (github.base_ref || github.ref_name) == 'main' && 'prod' || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${ENV}/terraform.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: terraform plan -no-color -input=false -var-file="${ENV}.tfvars" -out=tfplan

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const plan = execSync('terraform show -no-color tfplan').toString().slice(0, 60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan — \`${process.env.ENV}\`\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: Apply
        if: github.event_name == 'push'
        run: terraform apply -input=false tfplan
